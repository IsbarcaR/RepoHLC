<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Número de páginas almacenadas en el historial
        console.log("Páginas en el historial: ", history.length);

        // Ir a la página anterior
        history.back();

        // Volver a la página siguiente
        history.forward();

        // Moverse 2 páginas atrás y luego 2 adelante
        history.go(-2); // 2 páginas atrás
        history.go(2);  // 2 páginas adelante

    </script>
</body>

</html>
