<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="mouseDiv" style="width: 200px; height: 200px; border: 1px solid black;">
        <p id="coordinates">Coordenadas: (0, 0)</p>
        <p id="status">Estado: fuera</p>
    </div>

    <script>
        const mouseDiv = document.getElementById("mouseDiv");
        const coordinates = document.getElementById("coordinates");
        const status = document.getElementById("status");

        mouseDiv.addEventListener("mousemove", (e) => {
            coordinates.textContent = `Coordenadas: (${e.clientX}, ${e.clientY})`;
        });

        mouseDiv.addEventListener("mouseenter", () => {
            status.textContent = "Estado: dentro";
        });

        mouseDiv.addEventListener("mouseleave", () => {
            status.textContent = "Estado: fuera";
            coordinates.textContent = "Coordenadas: (0, 0)";
        });
    </script>

</body>

</html>
